<header class="h-16 sticky top-0 z-20 bg-bg/85 backdrop-blur border-b border-border
               flex items-center gap-4 px-5 md:px-8">

  <button id="sidebar-toggle" class="lg:hidden text-ink2 hover:text-ink transition-colors">
    <i data-lucide="menu" class="w-5 h-5"></i>
  </button>

  <div class="min-w-0">
    <p class="text-[11px] text-ink3 leading-none mb-1 hidden sm:block">NewsLens / {{ page_title }}</p>
    <h1 class="text-[15px] font-semibold text-ink leading-none truncate">{{ page_title }}</h1>
  </div>

  <div class="flex-1"></div>

  <div class="hidden md:flex items-center gap-2 w-64 h-9 px-3 rounded-nl bg-surfacealt border border-border
              text-ink3 focus-within:border-accent/40 transition-colors">
    <i data-lucide="search" class="w-[15px] h-[15px] shrink-0"></i>
    <input type="text" placeholder="Search events, sources, entities…"
           class="bg-transparent outline-none text-[13px] text-ink placeholder:text-ink3 w-full" />
  </div>

  <button class="w-9 h-9 rounded-nl border border-border bg-surfacealt btn-fill btn-fill-ghost flex items-center justify-center
                 text-ink2 hover:text-ink hover:border-accent/30 transition-colors relative">
    <i data-lucide="bell" class="w-[16px] h-[16px]"></i>
    <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-accent"></span>
  </button>

  <button id="analyze-btn"
          class="hidden sm:flex items-center gap-1.5 h-9 px-3.5 rounded-nl bg-accent text-[#06141C] text-[13px]
                 font-semibold btn-fill btn-fill-light active:scale-[0.98] transition-all shadow-[0_0_0_1px_rgba(76,201,240,0.25)]">
    <i data-lucide="scan-search" class="w-[15px] h-[15px]"></i>
    Analyze Article
  </button>

  <div class="w-9 h-9 rounded-full bg-elevated border border-border flex items-center justify-center text-[12px]
              font-semibold text-ink2 shrink-0">
    RA
  </div>
</header>

{% load static %}
<aside id="sidebar"
       class="fixed inset-y-0 left-0 z-40 w-[240px] -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out
              bg-surface border-r border-border flex flex-col">

  <div class="h-16 flex items-center gap-2.5 px-5 border-b border-border">
    <div class="w-7 h-7 rounded-[7px] bg-accent/10 border border-accent/25 flex items-center justify-center shrink-0">
      <i data-lucide="scan-line" class="w-4 h-4 text-accent"></i>
    </div>
    <span class="text-[15px] font-semibold tracking-tight text-ink">NewsLens</span>
  </div>

  <nav class="flex-1 px-3 py-5 flex flex-col gap-0.5">
    <p class="px-3 mb-2 text-[10.5px] font-medium text-ink3 tracking-wide">Workspace</p>

    <a href="{% url 'dashboard:overview' %}"
       class="nav-item btn-fill btn-fill-subtle {% if active_nav == 'overview' %}nav-item-active{% endif %}">
      <i data-lucide="layout-dashboard" class="w-[17px] h-[17px]"></i>
      <span>Overview</span>
    </a>

    <a href="{% url 'dashboard:articles' %}"
       class="nav-item btn-fill btn-fill-subtle {% if active_nav == 'articles' %}nav-item-active{% endif %}">
      <i data-lucide="newspaper" class="w-[17px] h-[17px]"></i>
      <span>Articles</span>
    </a>

    <a href="{% url 'dashboard:compare' %}"
       class="nav-item btn-fill btn-fill-subtle {% if active_nav == 'compare' %}nav-item-active{% endif %}">
      <i data-lucide="git-compare" class="w-[17px] h-[17px]"></i>
      <span>Compare</span>
    </a>

    <a href="{% url 'dashboard:analysis' %}"
       class="nav-item btn-fill btn-fill-subtle {% if active_nav == 'analysis' %}nav-item-active{% endif %}">
      <i data-lucide="radar" class="w-[17px] h-[17px]"></i>
      <span>Analysis</span>
    </a>

    <a href="{% url 'dashboard:trends' %}"
       class="nav-item btn-fill btn-fill-subtle {% if active_nav == 'trends' %}nav-item-active{% endif %}">
      <i data-lucide="trending-up" class="w-[17px] h-[17px]"></i>
      <span>Narrative Trends</span>
    </a>

    <div class="mt-6 pt-4 border-t border-border flex flex-col gap-0.5">
      <p class="px-3 mb-2 text-[10.5px] font-medium text-ink3 tracking-wide">System</p>
      <a href="{% url 'dashboard:settings' %}"
         class="nav-item btn-fill btn-fill-subtle {% if active_nav == 'settings' %}nav-item-active{% endif %}">
        <i data-lucide="settings" class="w-[17px] h-[17px]"></i>
        <span>Settings</span>
      </a>
      <a href="{% url 'dashboard:profile' %}"
         class="nav-item btn-fill btn-fill-subtle {% if active_nav == 'profile' %}nav-item-active{% endif %}">
        <i data-lucide="user-round" class="w-[17px] h-[17px]"></i>
        <span>Profile</span>
      </a>
    </div>
  </nav>

  <div class="px-5 py-4 border-t border-border">
    <p class="text-[12px] font-medium text-ink2">NewsLens v0.1</p>
    <p class="text-[11px] text-ink3">Research Prototype</p>
  </div>
</aside>

<div id="sidebar-backdrop" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>
